<svg width="694" height="462" viewBox="0 0 694 462" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B5F1"/>
      <stop offset="100%" stop-color="#0070F2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="694" height="462" rx="16" fill="white"/>

  <!-- Card 1 – shadcn/ui -->
  <rect x="14" y="120" width="214" height="222" rx="14" fill="#F0F0F0"/>
  <g transform="translate(121,231)" stroke="url(#grad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- outer card -->
    <rect x="-28" y="-26" width="56" height="52" rx="8" stroke-width="2.5"/>
    <!-- header divider -->
    <line x1="-28" y1="-10" x2="28" y2="-10" stroke-width="2.5"/>
    <!-- content block -->
    <rect x="-18" y="-3" width="20" height="16" rx="3" stroke-width="2"/>
    <!-- text lines -->
    <line x1="9" y1="1" x2="18" y2="1" stroke-width="2"/>
    <line x1="9" y1="8" x2="15" y2="8" stroke-width="2"/>
    <!-- bottom line -->
    <line x1="-18" y1="17" x2="10" y2="17" stroke-width="2"/>
  </g>

  <!-- Card 2 – Radix UI -->
  <rect x="240" y="120" width="214" height="222" rx="14" fill="#F0F0F0"/>
  <g transform="translate(347,231)" stroke="url(#grad)" stroke-linecap="round" fill="none">
    <!-- 6-arm asterisk -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke-width="2.5"/>
    <line x1="-26" y1="-15" x2="26" y2="15" stroke-width="2.5"/>
    <line x1="-26" y1="15" x2="26" y2="-15" stroke-width="2.5"/>
    <!-- dot at center -->
    <circle cx="0" cy="0" r="4.5" fill="url(#grad)" stroke="none"/>
  </g>

  <!-- Card 3 – MUI -->
  <rect x="466" y="120" width="214" height="222" rx="14" fill="#F0F0F0"/>
  <g transform="translate(573,231)" stroke="url(#grad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- M shape -->
    <polyline points="-28,28 -28,-28 0,6 28,-28 28,28" stroke-width="2.5"/>
    <!-- base bar -->
    <line x1="-28" y1="28" x2="28" y2="28" stroke-width="2.5"/>
  </g>
</svg>
